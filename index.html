<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="description" content="Поиск героев и костюмов FiskHeroes по имени, ID и паку. Копируй команду /suit одним нажатием. Работает как сайт и как Telegram Mini App.">
  <title>Hero Atlas — поиск героев Minecraft</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦸%3C/text%3E%3C/svg%3E">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#1e1e1e;--panel:#252526;--panel2:#2d2d2d;--line:#3c3c3c;--text:#d4d4d4;--muted:#8a8a8a;--accent:#007acc;--link:#3794ff;--sel:#094771;--btn:#0e639c;--shadow:0 10px 30px rgba(0,0,0,.45);--hdrH:57px;--gx:18px;--cardPad:16px;--ctlH:44px;color-scheme:dark}
    *{box-sizing:border-box} html{scroll-behavior:smooth;background:var(--bg)} body{margin:0;color:var(--text);background:radial-gradient(circle at top,#252526 0,transparent 38%), var(--bg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    button,input,select,textarea,code{font:inherit} button{cursor:pointer}
    /* iOS Safari auto-zooms the page when focusing a form control with font-size under 16px */
    input,select,textarea{font-size:16px}
    .hdr{position:sticky;top:0;z-index:30;background:rgba(30,30,30,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .hdr-in{width:min(1180px,100%);margin:auto;padding:10px var(--gx);display:flex;align-items:center;gap:14px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.12em;font-size:12px;text-transform:uppercase;white-space:nowrap}
    .langwrap{position:relative;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;width:var(--ctlH);height:var(--ctlH);padding:0;margin-left:auto;flex:0 0 auto;transition:border-color .15s}
    .langwrap:hover{border-color:var(--accent)}
    .langwrap svg{width:18px;height:18px;color:var(--accent);flex:0 0 auto;pointer-events:none}
    /* invisible native select overlays the pill: icon-only face, native dropdown */
    .langsel{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;background:transparent;cursor:pointer;outline:0;-webkit-appearance:none;appearance:none}
    .langsel option{background:var(--panel);color:var(--text)}
    .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#007acc,#3794ff);display:grid;place-items:center;font-size:19px}
    .search{flex:1;display:flex;align-items:center;gap:10px;background:#3c3c3c;border:1px solid #464646;border-radius:999px;height:var(--ctlH);padding:0 18px;transition:border-color .15s, box-shadow .15s}
    .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,204,.25)}
    .search span{font-size:16px}
    .search input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:16px;min-width:0}
    .search input::placeholder{color:#7a7a7a}
    .clear{display:none;border:0;background:transparent;color:var(--muted);font-size:15px;padding:0 2px}
    .search.has-q .clear{display:block}
    .abl{display:flex;align-items:center;border:0;background:transparent;color:var(--muted);padding:0 2px;cursor:pointer;transition:color .15s;position:relative}
    .abl svg{width:17px;height:17px}
    .abl:hover{color:var(--text)}
    .abl.on{color:var(--link)}
    .abl[data-n]::after{content:attr(data-n);position:absolute;top:-7px;right:-9px;background:var(--link);color:#1e1e1e;font-size:9px;font-weight:700;line-height:1;border-radius:999px;padding:2px 5px}
    .abl-panel{position:fixed;top:calc(var(--hdrH, 56px) + 6px);left:50%;transform:translateX(-50%);width:min(620px, calc(100vw - 24px));background:#252526;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:45;padding:10px;display:flex;flex-direction:column;gap:8px}
    .abl-panel[hidden]{display:none}
    .abl-head{display:flex;gap:8px}
    .abl-head input{flex:1;min-width:0;background:#1b1b1b;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px;font-size:13px;outline:0}
    .abl-head input::placeholder{color:#7a7a7a}
    .abl-head .btn{flex:none}
    .abl-list{max-height:46vh;overflow:auto;display:flex;flex-direction:column}
    .abl-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px}
    .abl-item:hover{background:#2a2d2e}
    .abl-item input{accent-color:var(--link);flex:none}
    .abl-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .abl-item b{margin-left:auto;color:var(--muted);font-weight:400;font-size:11px;flex:none}
    .abl-empty{color:var(--muted);padding:8px;font-size:12px}
    .wrap{width:min(1180px,100%);margin:auto;padding:0 var(--gx) 64px}
    .landing{text-align:center;padding:44px 0 4px}
    .landing h1{margin:0 0 12px;font-size:clamp(34px,6.5vw,64px);line-height:1.05;letter-spacing:-.05em} .landing h1 span{color:var(--link)}
    .landing .sub{color:var(--muted);font-size:15px;margin:0 0 20px}
    .landing .sub b{color:var(--text)}
    .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    .chip{border:1px solid var(--line);background:var(--panel);color:#cccccc;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;transition:border-color .15s,color .15s}
    .chip:hover{border-color:var(--accent);color:#fff}
    .home-grid{margin-top:28px;text-align:left}
    .toolbar{position:sticky;top:var(--hdrH);z-index:25;padding:12px 0 10px;background:linear-gradient(to bottom, rgba(30,30,30,.98) 70%, rgba(30,30,30,.85) 88%, rgba(30,30,30,0));}
    .toolbar-box{position:relative;display:flex;align-items:center}
    .tabs-wrap{position:relative;flex:1;min-width:0}
    /* smooth gradient fade over the chip strip's left edge (shown only when scrolled) */
    .tabs-wrap::before{content:'';position:absolute;left:0;top:0;bottom:0;width:24px;background:linear-gradient(to right,rgba(30,30,30,.98),rgba(30,30,30,0));opacity:0;transition:opacity .15s;pointer-events:none;z-index:2}
    .tabs-wrap.fade-l::before{opacity:1}
    .tabs{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:2px}
    .tabs::-webkit-scrollbar{display:none}
    .tab{border:1px solid var(--line);background:var(--panel2);color:#cccccc;padding:9px 12px;border-radius:12px;font-weight:700;font-size:12px;white-space:nowrap;flex:0 0 auto}
    .tab.active{background:var(--sel);color:#fff;border-color:var(--sel)}
    /* the counter floats over the chip strip and fades it out smoothly — no hard cut */
    .counter{position:absolute;right:0;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;white-space:nowrap;padding:4px 2px 4px 52px;background:linear-gradient(to right,rgba(30,30,30,0),rgba(30,30,30,.98) 46px,rgba(30,30,30,.98))}
    /* view controls: segmented buttons (Material 3 pattern) on their own toolbar row */
    .viewrow{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:8px}
    .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px}
    .seg[hidden]{display:none}
    .seg.dim{opacity:.4;pointer-events:none}
    .seg-btn{display:flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:30px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;transition:background .15s,color .15s}
    .seg-btn svg{width:15px;height:15px;flex:0 0 auto}
    .seg-btn:hover{color:var(--text)}
    .seg-btn.on{background:var(--sel);color:#fff}
    .seg-lbl{display:none}
    @media (min-width:640px){.seg-lbl{display:inline}}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.pack-card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:var(--cardPad);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
    .pack-card .topline{display:flex;justify-content:space-between;gap:8px;align-items:start}.pack-card h3{margin:0;font-size:18px;line-height:1.15}.pack-card .mini{font-size:12px;color:var(--muted)}
    .count{font-size:28px;font-weight:900;line-height:1;letter-spacing:-.04em}.colorbar{height:7px;border-radius:999px}
    .rows{display:flex;flex-direction:column;gap:8px}
    .row{display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;transition:border-color .12s}
    .row:hover{border-color:var(--accent)}
    .r-name{flex:1;min-width:140px;display:flex;align-items:center;gap:8px;font-size:14px}
    .badge{font-size:11px;font-weight:700;border:1px solid;border-radius:999px;padding:2px 8px;white-space:nowrap;opacity:.95}
    .r-id,.r-cmd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#9cdcfe;white-space:nowrap;cursor:pointer;flex:0 0 auto}
    .r-id:hover,.r-cmd:hover{color:var(--link)}
    .r-cmd{color:#ce9178}
    .r-btn{padding:7px 11px;font-size:11px;border-radius:9px;flex:0 0 auto}
    .btn{border:1px solid var(--btn);background:var(--btn);color:#fff;padding:9px 11px;border-radius:10px;font-weight:700;font-size:12px}
    .rows .row{cursor:pointer}
    .r-ava{position:relative;width:36px;height:48px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);background:#1b1b1b;display:grid;place-items:center;overflow:hidden}
    .r-ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    .r-ava img.px,.m-photo img.px,.g-photo img.px{image-rendering:pixelated}
    .r-ava .ph,.m-photo .ph{font-size:20px;opacity:.5}
    /* gallery view: card grid, N columns via --cols (default 2) */
    .cards{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px}
    .g-card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .12s}
    .g-card:hover{border-color:var(--accent)}
    .g-photo{position:relative;aspect-ratio:5/6;background:radial-gradient(circle at 50% 30%,#2d2d2d,#1b1b1b);border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;overflow:hidden}
    .g-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    .g-photo .ph{font-size:34px;opacity:.5}
    .g-name{min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;line-height:1.25}
    .g-name b{word-break:break-word}
    .g-name .badge{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis} /* must never widen the grid column */
    .g-cmd{display:block;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#ce9178;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:#1b1b1b;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
    .g-cmd:hover{color:var(--link)}
    .g-btn{width:100%;margin-top:auto;padding-left:4px;padding-right:4px;font-size:11px}
    /* hero details modal */
    .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
    .modal[hidden]{display:none}
    .m-panel [hidden]{display:none!important} /* flex/grid author styles must not resurrect hidden nodes */
    .m-back{position:absolute;inset:0;background:rgba(0,0,0,.62);border:0;padding:0}
    .m-panel{position:relative;width:min(860px,100%);max-height:min(88vh,780px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column}
    .m-body{display:flex;gap:18px;padding:18px}
    .m-photo{flex:0 0 300px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#2d2d2d,#1b1b1b);border:1px solid var(--line);border-radius:14px;min-height:300px;padding:10px}
    .m-photo img{max-width:100%;max-height:52vh;object-fit:contain}
    .m-photo .ph{font-size:64px;opacity:.5}
    .m-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
    .m-name{margin:0;font-size:22px;letter-spacing:-.02em;padding-right:34px}
    .m-badge{font-size:11px;font-weight:700;border:1px solid;border-radius:999px;padding:2px 8px;white-space:nowrap;align-self:flex-start}
    .m-chips{display:flex;gap:6px;flex-wrap:wrap}
    .m-chip{border:1px solid var(--line);background:var(--panel2);color:#cccccc;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
    .m-chip b{color:#fff}
    .m-sec{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:2px 0 0}
    .m-note{color:var(--text);font-size:13px;line-height:1.5;margin:0}
    .m-muted{color:var(--muted);font-size:12px;margin:0}
    .m-powers{display:flex;flex-wrap:wrap;gap:6px}
    .m-powers span{border:1px solid var(--line);background:var(--panel2);color:#9cdcfe;border-radius:999px;padding:3px 10px;font-size:12px}
    .m-ids{display:flex;flex-direction:column;gap:6px;margin-top:auto}
    .m-idrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .m-idrow code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#9cdcfe;cursor:pointer;background:#1b1b1b;border:1px solid var(--line);border-radius:8px;padding:6px 9px;word-break:break-all}
    .m-idrow code.cmd{color:#ce9178}
    .m-idrow code:hover{color:var(--link)}
    .m-idrow .btn{padding:6px 10px;font-size:11px}
    .m-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:10px 14px}
    .m-nav .btn{min-width:64px}
    .m-pos{color:var(--muted);font-size:12px;white-space:nowrap}
    .m-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;z-index:2}
    .m-close:hover{border-color:var(--accent);color:#fff}
    .empty{padding:24px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center;background:rgba(255,255,255,.02)}
    .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);color:#fff;border-radius:12px;padding:11px 14px;opacity:0;pointer-events:none;transition:.18s;z-index:40}.toast.show{opacity:1}
    .footer{width:min(1180px,100%);margin:0 auto;padding:24px var(--gx) 36px;color:var(--muted);font-size:12px}
    @media (max-width: 1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (max-width: 760px){:root{--gx:12px}.wrap{padding-bottom:56px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.landing{padding:32px 0 2px}}
    @media (max-width: 640px){.grid{grid-template-columns:1fr}.row{flex-wrap:wrap;padding:9px 12px;gap:6px 10px}.r-name{flex-basis:100%}.r-id{display:none}.r-cmd{flex:1;white-space:normal;word-break:break-all}.r-btn{margin-left:auto}.landing h1{font-size:34px}}
    @media (max-width: 720px){.m-body{flex-direction:column}.m-photo{flex:none;min-height:0}.m-photo img{max-height:36vh}}
    @media (max-width: 560px){.hdr-in{flex-wrap:wrap;gap:8px}.search{order:2;flex-basis:100%;padding:0 14px}.brand{order:1}.langwrap{order:1;margin-left:auto}}
  </style>
</head>
<body>
<header class="hdr" id="hdr">
  <div class="hdr-in">
    <div class="brand"><div class="logo">🦸</div> Hero Atlas</div>
    <label class="search" id="searchBox"><span>🔎</span><input id="search" placeholder="Поиск героя: имя, ID или пак — например, flash" autocomplete="off"><button class="abl" id="ablBtn" type="button" title="Искать по способностям"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg></button><button class="clear" id="clearBtn" type="button" title="Очистить">✕</button></label>
    <label class="langwrap" title="Language / Язык"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg><select class="langsel" id="lang" aria-label="Language"></select></label>
  </div>
</header>
<div class="abl-panel" id="ablPanel" hidden>
  <div class="abl-head"><input id="ablFilter" placeholder="Найти умение в списке…" autocomplete="off"><button class="btn" id="ablReset" type="button">Сбросить</button></div>
  <div class="abl-list" id="ablList"></div>
</div>
<main class="wrap">
  <section class="landing" id="landing">
    <h1 id="h1">Найди <span>героя</span> за секунды</h1>
    <p class="sub" id="sub"><b id="statHeroes">—</b> записей в <b id="statPacks">—</b> паках FiskHeroes · поиск на русском и английском, включая акронимы</p>
    <div class="chips" id="chips">
      <button class="chip" data-chip="spider">Spider-Man</button>
      <button class="chip" data-chip="человек-паук">человек-паук</button>
      <button class="chip" data-chip="flash">Flash</button>
      <button class="chip" data-chip="железный человек марк 42">марк 42</button>
      <button class="chip" data-chip="one punch man">one punch man</button>
      <button class="chip" data-chip="tgheroes:thor">tgheroes:thor</button>
    </div>
    <div class="home-grid" id="homePacks"></div>
  </section>
  <div class="toolbar">
    <div class="toolbar-box">
      <div class="tabs-wrap" id="tabsWrap"><div class="tabs" id="packTabs"></div></div>
      <div class="counter" id="counter">Загрузка…</div>
    </div>
    <div class="viewrow">
      <div class="seg" id="vswitch" role="group">
        <button class="seg-btn on" id="vsList" type="button" aria-pressed="true" aria-label="Список" title="Список"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg><span class="seg-lbl">Список</span></button>
        <button class="seg-btn" id="vsGal" type="button" aria-pressed="false" aria-label="Галерея" title="Галерея"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg><span class="seg-lbl">Галерея</span></button>
      </div>
      <div class="seg" id="colSeg" role="group" hidden>
        <button class="seg-btn cp on" data-cols="2" type="button">2</button>
        <button class="seg-btn cp" data-cols="3" type="button">3</button>
        <button class="seg-btn cp" data-cols="4" type="button">4</button>
      </div>
    </div>
  </div>
  <section><div id="content"><div class="empty">Загрузка данных…</div></div></section>
</main>
<footer class="footer"><span id="fCmd">Команда в игре:</span> <code>/suit packname:heroname</code> · <span id="fData">Данные:</span> <code>heroes_list.json + stats.json</code> · <span id="fList">Полный список:</span> <a style="color:var(--link)" href="hero_atlas_commands.txt">hero_atlas_commands.txt</a> · <a style="color:var(--link)" href="tests.html" id="fTests">автотесты</a></footer>
<div class="toast" id="toast">Скопировано</div>
<div class="modal" id="modal" hidden>
  <button class="m-back" id="mBack" type="button" tabindex="-1" aria-hidden="true"></button>
  <div class="m-panel" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="m-close" id="mClose" type="button" title="✕">✕</button>
    <div class="m-body">
      <div class="m-photo" id="mPhoto"></div>

  if(state.selAbilities.size) byId("ablBtn").setAttribute("data-n", state.selAbilities.size);
  else byId("ablBtn").removeAttribute("data-n");
  byId("ablFilter").placeholder = t("abl_ph");
  byId("ablReset").textContent = t("abl_reset");
  byId("vsList").title = t("view_list");
  byId("vsGal").title = t("view_gallery");
  byId("colSeg").title = t("gal_cols");
  byId("vsList").setAttribute("aria-label", t("view_list"));
  byId("vsGal").setAttribute("aria-label", t("view_gallery"));
  byId("colSeg").setAttribute("aria-label", t("gal_cols"));
  byId("vsList").querySelector(".seg-lbl").textContent = t("view_list");
  byId("vsGal").querySelector(".seg-lbl").textContent = t("view_gallery");
  byId("h1").innerHTML = t("h1").replace("{hero}","<span>"+escapeHtml(t("hero_noun"))+"</span>");
  byId("sub").innerHTML = t("sub").replace("{h}","<b id=\"statHeroes\">"+(state.data?state.data.meta.total:"—")+"</b>").replace("{p}","<b id=\"statPacks\">"+(state.data?state.data.packs.length:"—")+"</b>");
  byId("fCmd").textContent = t("f_cmd");
  byId("fData").textContent = t("f_data");
  byId("fList").textContent = t("f_list");
  byId("fTests").textContent = t("f_tests");
}
function applyLang(code){
  LANG = I18N[code] ? code : "ru";
  try{localStorage.setItem("ha_lang",LANG)}catch(e){}
  fillStatic();
  if(state.data) render();
  if(state.m) fillModal(); // re-localize the open modal
}
window.__setLang = applyLang;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
let state = {query:'', pack:'all', view:'heroes',
  hview: lsGet('ha_view')==='gallery' ? 'gallery' : 'list', // heroes rendering: list | gallery
  hcols: [2,3,4].includes(parseInt(lsGet('ha_cols'),10)) ? parseInt(lsGet('ha_cols'),10) : 2,
  data:null, m:null, selAbilities:new Set(), abilities:[]};
function norm(v){v=(v||'').toLowerCase().trim();try{v=v.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}catch(e){}return v}
function byId(id){return document.getElementById(id)}
function toast(msg){const t=byId('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1500)}
function haptic(){try{Telegram.WebApp.HapticFeedback.impactOccurred('light')}catch(e){}}
async function copy(text){
  try{await navigator.clipboard.writeText(text)}
  catch(e){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');ta.remove();
  }
  haptic();toast(t('copied').replace('{x}',text));
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}
function mapData(raw, aliases, descriptions, stats){
  aliases = aliases || {};
  descriptions = descriptions || {};
  stats = stats || {};
  const packs = Object.entries(raw.packs).map(([key,p],idx)=>({
    key,
    display: DISPLAY[key] || key,
    source: (p.sources || []).join(', '),
    count: p.heroes.length,
    color: PALETTE[idx % PALETTE.length],
    heroes: p.heroes.map(h=>({id:h.id,name:h.name,pack:key,packDisplay:DISPLAY[key]||key,command:'/suit '+h.id,aka:aliases[h.id]||[],
      image:h.image||null,image_wiki:h.image_wiki||null,image_game:h.image_game||null,image_model:h.image_model||null,wiki:h.wiki||null,desc:descriptions[h.id]||null,stats:stats[h.id]||null}))
  }));
  return {meta:{total:packs.reduce((a,p)=>a+p.count,0),packs:packs.length},packs};
}
async function loadData(){
  const res=await fetch('./heroes_list.json',{cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
async function loadAliases(){
  try{const r=await fetch('./aliases.json',{cache:'no-store'});return r.ok ? await r.json() : {}}catch(e){return {}}
}
async function loadDescriptions(){
  try{const r=await fetch('./descriptions.json',{cache:'no-store'});return r.ok ? await r.json() : {}}catch(e){return {}}
}
async function loadStats(){
  try{const r=await fetch('./stats.json',{cache:'no-store'});return r.ok ? await r.json() : {}}catch(e){return {}}
}
async function loadAbilityAliases(){
  try{const r=await fetch('./ability_aliases.json',{cache:'no-store'});return r.ok ? await r.json() : {}}catch(e){return {}}
}
function flatHeroes(){return state.data.packs.flatMap(p=>p.heroes.map(h=>({...h,color:p.color})))}
function filteredHeroes(){const q=norm(state.query);return flatHeroes().filter(h=>{const okPack = state.pack==='all' || h.pack===state.pack; if(!okPack) return false; if(q && !(norm(h.name).includes(q)||norm(h.id).includes(q)||norm(h.packDisplay).includes(q)||norm(h.pack).includes(q)||(h.aka&&h.aka.some(a=>norm(a).includes(q))))) return false; if(state.selAbilities.size && !(h.stats&&h.stats.abilities&&h.stats.abilities.some(a=>state.selAbilities.has(a)))) return false; return true;})}
function filteredPacks(){const q=norm(state.query);return state.data.packs.filter(p=>{if(state.pack!=='all' && p.key!==state.pack) return false; if(!q) return true; const inPack=norm(p.display).includes(q)||norm(p.key).includes(q)||norm(p.source).includes(q); const inHeroes=p.heroes.some(h=>norm(h.name).includes(q)||norm(h.id).includes(q)); return inPack||inHeroes;})}
function renderPackTabs(){
  const host=byId('packTabs');
  const total=state.data.packs.reduce((a,p)=>a+p.count,0);
  const tabs=[{key:'all',label:t('tab_all'),count:total},...state.data.packs.map(p=>({key:p.key,label:p.display,count:p.count})),{key:'__packs__',label:t('tab_packs')}];
  host.innerHTML=tabs.map(t=>{
    const active = t.key==='__packs__' ? state.view==='packs' : (state.view==='heroes' && state.pack===t.key);
    return `<button class="tab ${active?'active':''}" data-pack="${t.key}">${t.label}${t.count!==undefined?` <span style="opacity:.7">${t.count}</span>`:''}</button>`;
  }).join('');
  host.querySelectorAll('[data-pack]').forEach(btn=>btn.onclick=()=>{
    if(btn.dataset.pack==='__packs__'){state.view='packs'}
    else{state.view='heroes';state.pack=btn.dataset.pack}
    render();
  });
}
function avaHtml(h){
  const px=h.image&&!h.image.includes('/wiki/');
  if(h.image) return `<img class="${px?'px':''}" src="${attr(h.image)}" alt="${attr(h.name)}" loading="lazy" decoding="async">`;
  return `<span class="ph">🦸</span>`;
}
function renderHeroes(items){if(!items.length) return '<div class="empty">'+t((state.selAbilities.size&&!norm(state.query))?'empty_abl':'empty')+'</div>';if(state.hview==='gallery')return renderGallery(items);return `<div class="rows">${items.map(h=>`<div class="row" data-hero="${attr(h.id)}"><div class="r-ava">${avaHtml(h)}</div><div class="r-name"${h.aka&&h.aka.length?` title="${attr(t('aka').replace('{a}',h.aka.join(', ')))}"`:''}><b>${escapeHtml(h.name)}</b><span class="badge" style="border-color:${h.color}66;color:${h.color}">${escapeHtml(h.packDisplay)}</span></div><code class="r-id" data-copy="${attr(h.id)}">${escapeHtml(h.id)}</code><code class="r-cmd" data-copy="${attr(h.command)}" data-cmd="1">${escapeHtml(h.command)}</code><button class="btn r-btn" data-copy="${attr(h.command)}">${t('copy_btn')}</button></div>`).join('')}</div>`}
function renderGallery(items){return `<div class="cards" style="--cols:${state.hcols}">${items.map(h=>`<div class="g-card" data-hero="${attr(h.id)}"><div class="g-photo">${avaHtml(h)}</div><div class="g-name"${h.aka&&h.aka.length?` title="${attr(t('aka').replace('{a}',h.aka.join(', ')))}"`:''}><b>${escapeHtml(h.name)}</b><span class="badge" style="border-color:${h.color}66;color:${h.color}">${escapeHtml(h.packDisplay)}</span></div><code class="g-cmd" data-copy="${attr(h.command)}" data-cmd="1" title="${attr(h.command)}">${escapeHtml(h.command)}</code><button class="btn g-btn" data-copy="${attr(h.command)}">${t('copy_btn')}</button></div>`).join('')}</div>`}
function renderPacks(items){if(!items.length) return '<div class="empty">'+t('empty')+'</div>';return `<div class="grid">${items.map(p=>`<article class="pack-card"><div class="colorbar" style="background:${p.color}"></div><div class="topline"><div><h3>${escapeHtml(p.display)}</h3><div class="mini">${escapeHtml(p.key)}</div></div><div class="count" style="color:${p.color}">${p.count}</div></div><div class="mini">${escapeHtml(p.source || '')||t('no_source')}</div><div class="mini">${t('examples')} ${p.heroes.slice(0,3).map(h=>escapeHtml(h.name)).join(', ')}</div><div class="actions"><button class="btn" data-packjump="${p.key}">${t('show_heroes_btn')}</button></div></article>`).join('')}</div>`}
function render(){
  const searching = !!norm(state.query);
  const pristine = !searching && !state.selAbilities.size && state.pack==='all' && state.view==='heroes'; // landing only in the initial state
  byId('landing').style.display = pristine ? '' : 'none';
  byId('searchBox').classList.toggle('has-q', searching);
  fillStatic();
  const heroes=filteredHeroes();const packs=filteredPacks();
  byId('counter').textContent = searching
    ? t('found').replace('{n}', state.view==='heroes'?heroes.length:packs.length)
    : (state.view==='heroes'
        ? t('showing_heroes').replace('{a}',heroes.length).replace('{b}',state.data.meta.total)
        : t('showing_packs').replace('{a}',packs.length).replace('{b}',state.data.packs.length));
  renderPackTabs();
  if(pristine){ // pack cards pinned to the top of the landing
    byId('homePacks').innerHTML = renderPacks(state.data.packs);
  } else if(byId('homePacks').innerHTML){ // avoid stale duplicate cards outside the landing
    byId('homePacks').innerHTML = '';
  }
  const content=byId('content');
  content.innerHTML=state.view==='heroes'?renderHeroes(heroes):renderPacks(packs);
  content.querySelectorAll('[data-copy]').forEach(btn=>btn.onclick=()=>copy(btn.dataset.copy));
  content.querySelectorAll('[data-packjump]').forEach(btn=>btn.onclick=()=>{state.pack=btn.dataset.packjump;state.view='heroes';render();window.scrollTo({top:0,behavior:'smooth'})});
  content.querySelectorAll('.row[data-hero],.g-card[data-hero]').forEach(row=>row.onclick=e=>{if(e.target.closest('[data-copy]'))return;openModal(row.dataset.hero)});
  byId('homePacks').querySelectorAll('[data-packjump]').forEach(btn=>btn.onclick=()=>{state.pack=btn.dataset.packjump;state.view='heroes';render();window.scrollTo({top:0,behavior:'smooth'})});
  syncViewUI();
  syncTabsFade();
}
// ---- view switch (list / gallery) + cards-per-row segmented control ----
function syncViewUI(){
  const gallery = state.view==='heroes' && state.hview==='gallery';
  byId('vsList').classList.toggle('on', state.hview==='list');
  byId('vsGal').classList.toggle('on', state.hview==='gallery');
  byId('vsList').setAttribute('aria-pressed', String(state.hview==='list'));
  byId('vsGal').setAttribute('aria-pressed', String(state.hview==='gallery'));
  byId('vswitch').classList.toggle('dim', state.view!=='heroes');
  byId('colSeg').hidden = !gallery;
  byId('colSeg').querySelectorAll('.cp').forEach(b=>b.classList.toggle('on', parseInt(b.dataset.cols,10)===state.hcols));
}
function setView(v){
  state.hview = v==='gallery' ? 'gallery' : 'list';
  try{localStorage.setItem('ha_view',state.hview)}catch(e){}
  syncViewUI();
  if(state.data) render();
}
function setCols(n){
  n = parseInt(n,10);
  if(![2,3,4].includes(n)) return;
  state.hcols = n;
  try{localStorage.setItem('ha_cols',String(n))}catch(e){}
  if(state.data) render(); else syncViewUI();
}
window.__setView = setView;
window.__setCols = setCols;
byId('vsList').onclick = ()=>setView('list');
byId('vsGal').onclick = ()=>setView('gallery');
byId('colSeg').addEventListener('click',e=>{
  const b=e.target.closest('.cp');
  if(b) setCols(b.dataset.cols);
});
// smooth gradient fade on the chip strip's left edge once it is scrolled
function syncTabsFade(){
  const w=byId('tabsWrap'),s=byId('packTabs');
  if(!w||!s) return;
  w.classList.toggle('fade-l', s.scrollLeft>4);
}
byId('packTabs').addEventListener('scroll',syncTabsFade,{passive:true});
// ---- hero details modal ----
function findHero(id){return flatHeroes().find(h=>h.id===id)}
function openModal(heroId){
  const list=filteredHeroes();
  const idx=list.findIndex(h=>h.id===heroId);
  state.m={list: idx>=0?list:flatHeroes(), idx: Math.max(idx,0)};
  fillModal();
  byId('modal').hidden=false;
  document.body.style.overflow='hidden';
}
function closeModal(){state.m=null;byId('modal').hidden=true;document.body.style.overflow=''}
function modalNav(d){if(!state.m)return;const n=state.m.list.length;state.m.idx=(state.m.idx+d+n)%n;fillModal()}
function fmtDr(v){return String(v)}
function fillModal(){
  const h=state.m.list[state.m.idx];
  const photo=byId('mPhoto');
  const px=h.image&&!h.image.includes('/wiki/');
  photo.innerHTML=h.image
    ? `<img class="${px?'px':''}" src="${attr(h.image)}" alt="${attr(h.name)}">`
    : `<span class="ph">🦸</span>`;
  const badge=byId('mBadge');
  badge.hidden=false;
  badge.style.borderColor=h.color+'66';badge.style.color=h.color;
  badge.textContent=h.packDisplay;
  byId('mName').textContent=h.name;
  // chips: tier (from the game data) / damage reduction / cost from the wiki numbers
  const chips=[];
  if(h.stats&&h.stats.tier!==undefined&&h.stats.tier!==null) chips.push(`<span class="m-chip">${escapeHtml(t('m_tier'))} <b>${h.stats.tier}</b></span>`);
  if(h.desc&&h.desc.dr!==undefined) chips.push(`<span class="m-chip">${t('m_dr_fmt').replace('{v}','<b>'+fmtDr(h.desc.dr)+'</b>')}</span>`);
  if(h.desc&&h.desc.cost!==undefined) chips.push(`<span class="m-chip">${escapeHtml(t('m_cost'))}: <b>${h.desc.cost}</b> Tutridium</span>`);
  byId('mChips').innerHTML=chips.join('');
  // template description (localized): tier + origin, traits on their own line
  const note=byId('mNote');
  const st=h.stats||{};
  const origin=(st.tier!==undefined&&st.tier!==null)?t(h.pack==='fiskheroes'?'d_builtin_tier':'d_pack_tier').replace('{t}',st.tier).replace('{pack}',h.packDisplay):null;
  const traits=(st.traits&&st.traits.length)?t('d_traits').replace('{a}',st.traits.map(x=>t(x)).join(', ')):null;
  note.hidden=false;
  if(origin&&traits) note.innerHTML=escapeHtml(origin)+'<br><b>'+escapeHtml(t('d_traits_label'))+'</b> '+escapeHtml(traits);
  else if(origin) note.textContent=origin;
  else if(traits) note.innerHTML='<b>'+escapeHtml(t('d_traits_label'))+'</b> '+escapeHtml(traits);
  else note.textContent=h.pack==='fiskheroes'?t('m_builtin'):t('m_pack').replace('{pack}',h.packDisplay);
  // abilities (from the game's hero definitions)
  const pSec=byId('mPowersSec'),pBox=byId('mPowers');
  if(st.abilities&&st.abilities.length){pSec.hidden=false;pBox.hidden=false;pSec.textContent=t('m_powers');pBox.innerHTML=st.abilities.map(p=>`<span>${escapeHtml(p)}</span>`).join('')}
  else{pSec.hidden=true;pBox.hidden=true;pBox.innerHTML=''}
  // image source + no-preview caveat
  const src=byId('mSrc');
  const lines=[];
  if(!h.image) lines.push(t('m_no_preview'));
  else if(h.image===h.image_wiki) lines.push(t('m_src_wiki'));
  else if(h.image_model&&h.image===h.image_model) lines.push(t('m_src_model'));
  else lines.push(t('m_src_game'));
  src.hidden=false;src.textContent=lines.join(' · ');
  // ids + copy buttons
  byId('mId').textContent=h.id;
  byId('mCmd').textContent=h.command;
  byId('mIdCopy').textContent=t('copy_btn');
  byId('mCmdCopy').textContent=t('copy_btn');
  byId('mIdCopy').onclick=()=>copy(h.id);
  byId('mCmdCopy').onclick=()=>copy(h.command);
  // nav
  byId('mPos').textContent=(state.m.idx+1)+' / '+state.m.list.length;
  byId('mPrev').title=t('m_prev');byId('mNext').title=t('m_next');
  byId('mClose').title=t('m_close');
  byId('mPrev').onclick=()=>modalNav(-1);
  byId('mNext').onclick=()=>modalNav(1);
  byId('mClose').onclick=closeModal;
  const panel=byId('modal').querySelector('.m-panel');
  panel.scrollTop=0;
}
function renderError(){byId('content').innerHTML='<div class="empty">'+t('error')+' <button class="btn" data-retry>'+t('retry')+'</button></div>';byId('content').querySelector('[data-retry]').onclick=()=>init()}
async function init(){
  LANG = detectLang();
  applyLang(LANG);
  if(window.Telegram && Telegram.WebApp){
    try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}
    try{Telegram.WebApp.setHeaderColor('#1e1e1e');Telegram.WebApp.setBackgroundColor('#1e1e1e');}catch(e){}
  }
  byId('counter').textContent=t('loading');
  try{
    const [raw, aliases, descs, stats, ablAliases]=await Promise.all([loadData(), loadAliases(), loadDescriptions(), loadStats(), loadAbilityAliases()]);
    state.data=mapData(raw, aliases, descs, stats);
    collectAbilities(ablAliases);
  }catch(e){console.error('heroes_list.json load failed:',e);renderError();return}
  render();
}
byId('search').addEventListener('input',e=>{state.query=e.target.value;if(state.data)render()});
// ---- ability filter panel (checkbox picker over all abilities in stats.json) ----
function collectAbilities(aliasMap){
  aliasMap = aliasMap || {};
  const m=new Map();
  flatHeroes().forEach(h=>(h.stats&&h.stats.abilities||[]).forEach(a=>m.set(a,(m.get(a)||0)+1)));
  state.abilities=[...m].map(([name,n])=>({name,n,aliases:aliasMap[name]||[]})).sort((x,y)=>x.name.localeCompare(y.name));
}
function renderAblPanel(){
  const q=norm(byId('ablFilter').value);
  const items=(state.abilities||[]).filter(a=>!q||norm(a.name).includes(q)||(a.aliases||[]).some(al=>norm(al).includes(q)));
  byId('ablList').innerHTML=items.length
    ? items.map(a=>{
        const hint=(a.aliases&&a.aliases.length)?` title="${attr(t('aka').replace('{a}',a.aliases.join(', ')))}"`:'';
        return `<label class="abl-item"${hint}><input type="checkbox" value="${attr(a.name)}"${state.selAbilities.has(a.name)?' checked':''}><span>${escapeHtml(a.name)}</span><b>${a.n}</b></label>`;
      }).join('')
    : `<div class="abl-empty">${t('empty_abl')}</div>`;
}
byId('ablBtn').addEventListener('click',()=>{
  const p=byId('ablPanel');
  p.hidden=!p.hidden;
  if(!p.hidden){byId('ablFilter').value='';renderAblPanel();}
});
byId('ablFilter').addEventListener('input',renderAblPanel);
byId('ablReset').addEventListener('click',()=>{
  state.selAbilities.clear();
  fillStatic();renderAblPanel();render();
});
byId('ablList').addEventListener('change',e=>{
  const cb=e.target.closest('input[type="checkbox"]');if(!cb)return;
  if(cb.checked)state.selAbilities.add(cb.value);else state.selAbilities.delete(cb.value);
  fillStatic();render();
});
document.addEventListener('click',e=>{
  const p=byId('ablPanel');
  if(p.hidden||e.target.closest('#ablPanel')||e.target.closest('#ablBtn'))return;
  p.hidden=true;
});
byId('clearBtn').addEventListener('click',()=>{byId('search').value='';state.query='';render();byId('search').focus()});
document.getElementById('chips').addEventListener('click',e=>{
  const chip=e.target.closest('[data-chip]');if(!chip)return;
  byId('search').value=chip.dataset.chip;state.query=chip.dataset.chip;render();byId('search').focus();
});
// keep the sticky toolbar right below the header on any screen size
new ResizeObserver(()=>document.documentElement.style.setProperty('--hdrH', byId('hdr').offsetHeight+'px')).observe(byId('hdr'));
// modal: backdrop click + keyboard
byId('mBack').onclick=closeModal;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!byId('ablPanel').hidden&&!state.m){byId('ablPanel').hidden=true;return}
  if(!state.m) return;
  if(e.key==='Escape') closeModal();
  else if(e.key==='ArrowLeft') modalNav(-1);
  else if(e.key==='ArrowRight') modalNav(1);
});
// language switcher
byId('lang').innerHTML = Object.keys(I18N).map(c=>`<option value="${c}">${LANG_NAMES[c]}</option>`).join('');
byId('lang').onchange = e => applyLang(e.target.value);
// autofocus only in a normal browser — in Telegram WebView it would force the keyboard open
if(!(window.Telegram && Telegram.WebApp && Telegram.WebApp.initData)){byId('search').focus()}
syncViewUI(); // reflect the persisted view mode while data is still loading
init();
</script>
